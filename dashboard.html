<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teacher Dashboard - QR Attendance System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="appPage">
    <div class="sidebar">
        <div class="brand">QR<span>Attend</span></div>
        <div class="user-box">
            <div class="user-name" id="sidebarUserName">-</div>
            <div class="user-role" id="sidebarUserRole">-</div>
        </div>
        <div id="navigation">
            <button class="nav-btn active" onclick="loadDashboard()">📊 Dashboard</button>
            <button class="nav-btn" onclick="loadSessions()">📋 Daily Sessions</button>
        </div>
        <button class="logout-btn" onclick="logout()">↪ Logout</button>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div>
                <h2 id="pageTitle">Dashboard</h2>
                <p>Start and monitor attendance sessions</p>
            </div>
            <div class="top-user" id="topUserName">-</div>
        </div>

        <div class="stats-grid" style="grid-template-columns: 1fr; max-width: 260px;">
            <div class="stat-card"><span>Sessions Started</span><strong id="sessionCount">0</strong></div>
        </div>

        <div class="content-grid">
            <div class="card">
                <h3>Start Daily Attendance</h3>
                <form id="attendanceForm">
                    <label>QR Expiry (minutes)</label>
                    <input type="number" id="expiryMinutes" min="1" max="180" value="5" required>
                    <button type="submit" class="primary-btn full">Generate QR Code</button>
                </form>
                <div id="teacherMessage" class="message"></div>
            </div>

            <div id="qrCard" class="card qr-card hidden">
                <h3>Daily Attendance</h3>
                <div class="qr-container" id="qrcode"></div>
                <div class="qr-live">🔄 refreshes every second — old codes stop working</div>
                <div class="qr-timer" id="qrTimer">00:00</div>
                <button class="danger-btn full" onclick="closeAttendanceSession()">Close Session</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h3>Past Sessions</h3></div>
            <div class="table-container" id="sessionsTable"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
