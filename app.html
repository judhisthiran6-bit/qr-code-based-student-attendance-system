<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QR Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="appPage" class="page">

    <div class="sidebar">
        <div class="brand">QR<span>Attend</span></div>

        <div class="user-box">
            <div class="user-name" id="sidebarUserName">-</div>
            <div class="user-role" id="sidebarUserRole">-</div>
        </div>

        <div id="navigation"></div>

        <button class="logout-btn" onclick="logout()">↪ Logout</button>
    </div>

    <div class="main-content">

        <div class="topbar">
            <div>
                <h2 id="pageTitle">Dashboard</h2>
                <p>Welcome back</p>
            </div>
            <div class="top-user" id="topUserName">-</div>
        </div>

        <!-- ================= ADMIN DASHBOARD ================= -->
        <div id="adminDashboard" class="dashboard-section hidden">
            <div class="stats-grid">
                <div class="stat-card blue">
                    <span>Total Users</span>
                    <strong id="adminUsersCount">0</strong>
                </div>
                <div class="stat-card green">
                    <span>Teachers</span>
                    <strong id="adminTeachersCount">0</strong>
                </div>
                <div class="stat-card purple">
                    <span>Attendance Records</span>
                    <strong id="adminAttendanceCount">0</strong>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>All Users</h3>
                </div>
                <div class="table-container" id="usersTable"></div>
            </div>
        </div>

        <!-- ================= TEACHER DASHBOARD ================= -->
        <div id="teacherDashboard" class="dashboard-section hidden">
            <div class="stats-grid">
                <div class="stat-card blue">
                    <span>Attendance Sessions Started</span>
                    <strong id="teacherSessionCount">0</strong>
                </div>
            </div>

            <div class="content-grid">
                <div class="card">
                    <h3>Start Daily Attendance</h3>
                    <form id="attendanceForm">
                        <label>QR Expiry (minutes)</label>
                        <input type="number" id="expiryMinutes" min="1" max="180" value="5" required>

                        <button type="submit" class="primary-btn full">Generate QR Code</button>
                    </form>
                    <div id="teacherMessage" class="message"></div>
                </div>

                <div id="qrCard" class="card qr-card hidden">
                    <h3 id="qrSubject">Daily Attendance</h3>
                    <div class="qr-container" id="qrcode"></div>
                    <div class="qr-timer" id="qrTimer">00:00</div>
                    <button class="danger-btn full" onclick="closeAttendanceSession()">Close Session</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Past Sessions</h3>
                </div>
                <div class="table-container" id="teacherSessionsTable"></div>
            </div>
        </div>

        <!-- ================= STUDENT DASHBOARD ================= -->
        <div id="studentDashboard" class="dashboard-section hidden">
            <div class="stats-grid">
                <div class="stat-card green">
                    <span>Overall Attendance</span>
                    <strong id="overallAttendance">0%</strong>
                </div>
            </div>

            <div class="content-grid">
                <div class="card">
                    <h3>Scan Today's QR Code</h3>
                    <div id="reader" class="scanner"></div>
                    <button id="startScannerBtn" class="primary-btn full" onclick="startScanner()">Start Scanning</button>
                    <button id="stopScannerBtn" class="danger-btn full hidden" onclick="stopScanner()">Stop Scanning</button>
                    <div id="scanMessage" class="message"></div>
                </div>

                <div class="card">
                    <h3>Attendance Summary</h3>
                    <div id="studentSummary"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Attendance History</h3>
                </div>
                <div class="table-container" id="studentAttendanceTable"></div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
