<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - QR Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-admin">

<div id="loginPage" class="page auth-page">
    <div class="login-container">
        <div class="login-left">
            <div class="brand-large">QR<span>Attend</span></div>
            <div class="role-tag">🛠️ Admin Portal</div>
            <h1>Welcome, Admin</h1>
            <p>Oversee every teacher and student account and monitor attendance across the whole system.</p>
            <div class="feature-list">
                <div>✓ View all registered users</div>
                <div>✓ See every teacher's sessions</div>
                <div>✓ System-wide attendance records</div>
            </div>
        </div>

        <!-- LOGIN CARD (admins are created via seed_admin.py, no self sign-up) -->
        <div id="loginSection" class="login-card">
            <h2>Admin Login</h2>
            <p class="muted">Sign in to your admin account</p>

            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter email" required>

                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>

                <button type="submit" class="primary-btn full">Login</button>
            </form>

            <div id="loginMessage" class="message"></div>
        </div>
    </div>
</div>

<script>
    const PAGE_ROLE = "admin";
</script>
<script src="app.js"></script>
</body>
</html>
